<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagram Gallery · 图表设计库</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08090d;
    --panel: rgba(18, 21, 28, .72);
    --panel-solid: #11141b;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.14);
    --text: #e8edf2;
    --muted: #8b95a3;
    --muted-2: #565f6c;
    --accent: #62d4ff;
    --accent-2: #b59cff;
    --serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
    --sans: 'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(900px 480px at 85% -10%, rgba(98,212,255,.09), transparent 60%),
      radial-gradient(700px 420px at -10% 110%, rgba(181,156,255,.08), transparent 60%),
      var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .app { height: 100vh; display: flex; flex-direction: column; }
  /* ── 顶栏 ── */
  .topbar {
    height: 58px; flex-shrink: 0;
    display: flex; align-items: center; gap: 18px;
    padding: 0 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(8, 9, 13, .78);
    backdrop-filter: blur(14px);
    position: relative; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: #08131a;
    align-self: center;
    box-shadow: 0 0 22px rgba(98,212,255,.35);
  }
  .brand-name { font-size: 15px; font-weight: 650; letter-spacing: .02em; }
  .brand-name em { font-style: normal; color: var(--accent); }
  .brand-sub { font-family: var(--mono); font-size: 9px; color: var(--muted-2); letter-spacing: .16em; text-transform: uppercase; }
  .topbar-spacer { flex: 1; }
  .count-pill {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 4px 12px; background: rgba(255,255,255,.02);
  }
  .theme-toggle {
    display: flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden;
  }
  .theme-toggle button {
    border: 0; background: transparent; color: var(--muted);
    font-size: 11px; padding: 5px 13px; cursor: pointer; font-family: var(--sans);
    transition: all .2s;
  }
  .theme-toggle button.on { background: rgba(98,212,255,.12); color: var(--accent); }
  .github-link {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    transition: all .2s;
  }
  .github-link:hover { border-color: var(--accent); color: var(--text); box-shadow: 0 0 16px rgba(98,212,255,.15); }
  /* ── 主区 ── */
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 264px; flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(14px);
    overflow-y: auto;
    padding: 16px 12px 20px;
  }
  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
  .group-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted-2); padding: 14px 10px 7px;
  }
  .diagram-item {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; margin-bottom: 2px;
    border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--muted);
    font-size: 12px; font-family: var(--sans); text-align: left; cursor: pointer;
    transition: all .15s;
  }
  .diagram-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .diagram-item.active {
    background: linear-gradient(90deg, rgba(98,212,255,.13), rgba(98,212,255,.02));
    border-color: rgba(98,212,255,.28);
    color: var(--text);
  }
  .diagram-item .idx { font-family: var(--mono); font-size: 9px; color: var(--muted-2); width: 16px; }
  .diagram-item.active .idx { color: var(--accent); }
  /* ── 预览区 ── */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .stage-header {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 0 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(8,9,13,.55);
  }
  .stage-eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .stage-title { font-family: var(--serif); font-size: 17px; font-weight: 400; letter-spacing: .01em; }
  .stage-sub { font-family: var(--mono); font-size: 10px; color: var(--muted-2); }
  .stage-spacer { flex: 1; }
  .open-link { font-size: 11px; color: var(--accent); text-decoration: none; border-bottom: 1px dashed rgba(98,212,255,.4); padding-bottom: 1px; }
  .open-link:hover { border-bottom-style: solid; }
  .frame-wrap { flex: 1; padding: 26px; min-height: 0; }
  .frame-card {
    width: 100%; height: 100%;
    background: var(--panel-solid);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02) inset;
    position: relative;
  }
  .frame-card::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(98,212,255,.5), transparent);
    z-index: 2; opacity: .5;
  }
  iframe {
    width: 100%; height: 100%; border: 0; display: block;
    background: #f5f5f5;
    transition: opacity .25s;
  }
  .frame-card.loading iframe { opacity: .35; }
  .frame-loader {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--muted-2);
    text-transform: uppercase;
  }
  .frame-loader .dot { animation: pulse 1.2s infinite; }
  .frame-loader .dot:nth-child(2) { animation-delay: .2s; }
  .frame-loader .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  .statusbar {
    height: 34px; flex-shrink: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px;
    border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10px; color: var(--muted-2);
    background: rgba(8,9,13,.6);
  }
  .statusbar .led { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  /* 移动端 */
  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; height: 132px; border-right: 0; border-bottom: 1px solid var(--line); }
    .group-label { display: none; }
    .topbar .brand-sub { display: none; }
    .frame-wrap { padding: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <div>
        <div class="brand-name">Diagram <em>Gallery</em></div>
        <div class="brand-sub">Editorial Diagram Library</div>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <span class="count-pill" id="count-pill">35 种图表</span>
    <div class="theme-toggle" id="theme-toggle">
      <button data-mode="light" class="on">亮</button>
      <button data-mode="dark">暗</button>
    </div>
    <a class="github-link" href="https://github.com/cathrynlavery/diagram-design" target="_blank" rel="noopener">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.36.77 1.05.77 2.13v3.16c0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
      原作 MIT
    </a>
  </header>

  <div class="main">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="stage">
      <div class="stage-header">
        <span class="stage-eyebrow" id="stage-eyebrow">Type 01</span>
        <span class="stage-title" id="stage-title">—</span>
        <span class="stage-sub" id="stage-sub"></span>
        <div class="stage-spacer"></div>
        <a class="open-link" id="open-link" href="#" target="_blank" rel="noopener">新窗口打开 ↗</a>
      </div>
      <div class="frame-wrap">
        <div class="frame-card" id="frame-card">
          <div class="frame-loader">LOADING<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
          <iframe id="preview" title="图表预览"></iframe>
        </div>
      </div>
      <footer class="statusbar">
        <span class="led"></span>
        <span id="status-text">就绪</span>
        <span style="flex:1"></span>
        <span>本地渲染 · 无需后端</span>
        <span>·</span>
        <span id="variant-label">亮色模板</span>
      </footer>
    </main>
  </div>
</div>

<script>
const DIAGRAMS = [
  // 数据图表
  { id: 'bar', cat: '数据图表', name: '柱状图 · Bar', desc: '冲刺速度 · 8 个冲刺视图' },
  { id: 'line', cat: '数据图表', name: '折线图 · Line', desc: '趋势与连续数据' },
  { id: 'scatter', cat: '数据图表', name: '散点图 · Scatter', desc: '二维分布相关分析' },
  { id: 'radar', cat: '数据图表', name: '雷达图 · Radar', desc: '多维指标对比' },
  { id: 'gantt', cat: '数据图表', name: '甘特图 · Gantt', desc: '项目排期与里程碑' },
  { id: 'timeline', cat: '数据图表', name: '时间线 · Timeline', desc: '事件演进脉络' },
  { id: 'venn', cat: '数据图表', name: '维恩图 · Venn', desc: '集合交集关系' },
  { id: 'pyramid', cat: '数据图表', name: '金字塔 · Pyramid', desc: '层级数量结构' },
  { id: 'quadrant', cat: '数据图表', name: '象限图 · Quadrant', desc: '四象限战略分析' },
  { id: 'quadrant-consultant', cat: '数据图表', name: '咨询象限图', desc: '咨询顾问风格四象限' },
  { id: 'datalake', cat: '数据图表', name: '数据湖 · Datalake', desc: '数据分层存储架构' },
  { id: 'medallion', cat: '数据图表', name: '奖章架构 · Medallion', desc: 'Bronze-Silver-Gold 分层' },
  // 架构图表
  { id: 'architecture', cat: '架构图表', name: '架构图 · Architecture', desc: '系统整体架构' },
  { id: 'high-level', cat: '架构图表', name: '高层架构图', desc: '系统概览视角' },
  { id: 'high-level-vertical', cat: '架构图表', name: '高层架构(竖)', desc: '纵向概览视角' },
  { id: 'layers', cat: '架构图表', name: '分层图 · Layers', desc: '横向层次堆叠' },
  { id: 'nested', cat: '架构图表', name: '嵌套图 · Nested', desc: '嵌套包含关系' },
  { id: 'dp-integration', cat: '架构图表', name: '数据平台集成图', desc: '平台组件集成' },
  { id: 'dp-security-matrix', cat: '架构图表', name: '安全矩阵图', desc: '安全控制矩阵' },
  { id: 'it-state', cat: '架构图表', name: 'IT 状态图', desc: '基础设施状态' },
  { id: 'state', cat: '架构图表', name: '状态机 · State', desc: '状态流转机' },
  { id: 'tree', cat: '架构图表', name: '树形图 · Tree', desc: '层级树状结构' },
  // 流程图表
  { id: 'flowchart', cat: '流程图表', name: '流程图 · Flowchart', desc: '流程分支逻辑' },
  { id: 'process', cat: '流程图表', name: '流程图 · Process', desc: '线性处理步骤' },
  { id: 'data-flow', cat: '流程图表', name: '数据流图', desc: '数据流转路径' },
  { id: 'loop', cat: '流程图表', name: '循环图 · Loop', desc: '循环处理逻辑' },
  { id: 'loop-terminal', cat: '流程图表', name: '终端循环图', desc: '带终端的循环' },
  { id: 'swimlane', cat: '流程图表', name: '泳道图 · Swimlane', desc: '跨角色责任流程' },
  { id: 'sequence', cat: '流程图表', name: '时序图 · Sequence', desc: '对象交互时序' },
  { id: 'sequence-oauth', cat: '流程图表', name: 'OAuth 时序图', desc: 'OAuth 授权流程' },
  { id: 'queue-animated', cat: '流程图表', name: '队列流程(动效)', desc: '消息队列动态演示' },
  { id: 'paved-road-animated', cat: '流程图表', name: '铺路法(动效)', desc: '平台工程铺路法' },
  { id: 'policy-trace-animated', cat: '流程图表', name: '策略追踪(动效)', desc: '策略审计追踪' },
  // 组织图表
  { id: 'org-chart', cat: '组织图表', name: '组织架构图', desc: '汇报关系层级' },
  { id: 'er', cat: '组织图表', name: 'ER 关系图', desc: '实体关系建模' },
]

// 没有深色变体的模板（原作未提供 -dark 文件）
const NO_DARK = new Set(['loop-terminal', 'quadrant-consultant', 'paved-road-animated', 'policy-trace-animated', 'queue-animated'])
const variantFile = (id) => {
  if (mode === 'dark' && !NO_DARK.has(id)) return 'example-' + id + '-dark.html'
  return 'example-' + id + '.html'
}

const catOrder = ['数据图表', '架构图表', '流程图表', '组织图表']
const groups = catOrder.map(cat => ({ cat, items: DIAGRAMS.filter(d => d.cat === cat) }))
document.getElementById('count-pill').textContent = DIAGRAMS.length + ' 种图表'

// 渲染侧边栏
const sidebar = document.getElementById('sidebar')
const renderSidebar = () => {
  sidebar.innerHTML = ''
  let idx = 0
  for (const group of groups) {
    const label = document.createElement('div')
    label.className = 'group-label'
    label.textContent = group.cat
    sidebar.appendChild(label)
    for (const item of group.items) {
      idx++
      const btn = document.createElement('button')
      btn.className = 'diagram-item'
      btn.dataset.id = item.id
      btn.innerHTML = `<span class="idx">${String(idx).padStart(2, '0')}</span><span>${item.name}</span>`
      btn.addEventListener('click', () => select(item.id))
      sidebar.appendChild(btn)
    }
  }
}

// 状态
let mode = 'light'
let current = 'bar'

const frameCard = document.getElementById('frame-card')
const preview = document.getElementById('preview')

const select = (id) => {
  current = id
  document.querySelectorAll('.diagram-item').forEach(el => el.classList.toggle('active', el.dataset.id === id))
  const item = DIAGRAMS.find(d => d.id === id)
  const num = DIAGRAMS.findIndex(d => d.id === id) + 1
  document.getElementById('stage-eyebrow').textContent = 'Type ' + String(num).padStart(2, '0')
  document.getElementById('stage-title').textContent = item.name
  document.getElementById('stage-sub').textContent = item.desc
  document.getElementById('open-link').href = 'templates/' + variantFile(id)
  loadFrame(id)
}

const loadFrame = (id) => {
  frameCard.classList.add('loading')
  const file = variantFile(id)
  preview.src = 'templates/' + file
  preview.onload = () => {
    frameCard.classList.remove('loading')
    document.getElementById('status-text').textContent = '已加载 ' + file
  }
}

// 明暗切换
document.getElementById('theme-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button')
  if (!btn) return
  mode = btn.dataset.mode
  document.querySelectorAll('#theme-toggle button').forEach(b => b.classList.toggle('on', b === btn))
  document.getElementById('variant-label').textContent = mode === 'dark' ? '深色模板' : '亮色模板'
  select(current)
})

renderSidebar()
select('bar')
</script>
</body>
</html>
